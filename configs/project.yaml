project:
  name: fintech
  stage: optuna_tuning_implemented
  current_tuning_study: S003
  current_model_study: S002
  current_model_report: docs/model_research_S002.md
  current_model_selection: docs/model_research_S002_selection.json
  repository: https://github.com/xxawa66/fintech.git

# Resolve all paths from the repository root.
paths:
  train: data/raw/训练集.csv
  test_x: data/raw/测试集_X.csv
  processed: data/processed
  models: outputs/models
  figures: outputs/figures
  metrics: outputs/metrics
  predictions: outputs/predictions
  submissions: outputs/submissions
  experiment_log: experiments/experiment_log.csv
  research_cache: data/processed/research_cache
  research_studies: outputs/metrics/research_studies
  research_reports: docs
  optuna_cache: data/processed/optuna_cache

data:
  key_columns: [ts_code, trade_date]
  target_column: y_ret_1d
  prediction_column: pred
  raw_feature_columns: [open, high, low, close, vol, amount, flag_limit_up, flag_limit_down]

evaluation:
  official_python: evaluate.py
  official_r: evaluate.R
  annualization_days: 252
  top_fraction: 0.1
  weights:
    rank_ic: 0.4
    annual_excess: 0.3
    stability: 0.3
  # 留仓带换手层（docs/turnover_optimization.md）：2026-10-06 团队锁定 keep_q=0.1。
  # model_analysis 模板默认叠加该层；0 表示分析时不叠加。
  band:
    keep_q: 0.1

# 时间验证切分：闭区间，日期为 YYYYMMDD 整数。
# 规则：训练标签不得跨验证边界——训练窗口最后一个交易日（其 y 使用验证期首个交易日
# 收盘价）的标签在切分时置 NaN，由训练侧按“删除无标签样本”处理。
# 验证集保留期内全部官方标签（含期末日由测试期价格计算的标签），与官方评分口径一致。
validation:
  folds:
    - name: fold1
      train: [20180102, 20221231]
      valid: [20230101, 20231231]
    - name: fold2
      train: [20180102, 20231231]
      valid: [20240101, 20241231]
  final:
    train_all: [20180102, 20241231]
    test: [20250102, 20260608]

# v1: 40 features. All windows contain only current and past observations.
features:
  version: baseline_v1
  expected_count: 40
  return_windows: [1, 2, 3, 5, 10, 20, 40, 60]
  ma_windows: [5, 10, 20, 60]
  volatility_windows: [5, 10, 20, 60]
  volume_windows: [5, 10, 20, 60]
  amount_windows: [5, 20]
  volume_change_windows: [1, 5]
  position_windows: [20, 60]
  rank_sources: [ret_1, ret_5, ret_20, volatility_20, vol_ratio_20]

baseline:
  default_fold: fold2
  fallback_prediction: 0.0
  smoke_stocks: 256
  smoke_rounds: 10
  score_tolerance: 1.0e-10
  model:
    num_boost_round: 200
    params:
      objective: regression
      boosting_type: gbdt
      metric: l2
      learning_rate: 0.05
      num_leaves: 31
      max_depth: -1
      min_data_in_leaf: 200
      lambda_l1: 0.0
      lambda_l2: 1.0
      feature_fraction: 1.0
      bagging_fraction: 1.0
      bagging_freq: 0
      max_bin: 255
      seed: 42
      num_threads: 8
      device_type: cpu
      deterministic: true
      force_col_wise: true
      use_missing: true
      zero_as_missing: false
      verbosity: -1

# Day 5–8: fixed model; 2023 selection, one 2024 candidate confirmation.
research:
  pool_version: research_v2
  study_fold: fold1
  confirm_fold: fold2
  reference_exp_id: E000_baseline_retry1
  selection_tolerance: 1.0e-6
  parity_tolerance: 1.0e-10
  windows:
    path: 20
    correlation: 20
    signed_volume: [5, 20]
    volume_cv: 20
    volatility_pairs: [[5, 20], [20, 60]]
    risk_return: 20
    atr: [5, 20]
  groups:
    T: [trend_efficiency_20, up_ratio_20, downside_rms_20, return_skew_20, return_kurt_20, rank_trend_efficiency_20]
    V: [corr_ret_logvol_20, corr_price_vol_20, signed_vol_ratio_5, signed_vol_ratio_20, volume_cv_20, rank_signed_vol_ratio_20]
    R: [volatility_ratio_5_20, volatility_ratio_20_60, risk_adj_ret_20, true_range_relative, atr_ratio_5_20, rank_risk_adj_ret_20]
  presets:
    - {name: base, groups: []}
    - {name: trend, groups: [T]}
    - {name: volume, groups: [V]}
    - {name: risk, groups: [R]}
    - {name: all, groups: [T, V, R]}
    - {name: without_trend, groups: [V, R]}
    - {name: without_volume, groups: [T, R]}
    - {name: without_risk, groups: [T, V]}

# Day 9–12: fixed V1 features; 2023 selection and one locked 2024 confirmation.
model_research:
  study_fold: fold1
  confirm_fold: fold2
  selection_tolerance: 1.0e-6
  keep_q: 0.1
  initial_state: cold_start
  references:
    fold1: {raw_exp_id: S001_screen_base, band_record_id: E003_band_kq01_fold1}
    fold2: {raw_exp_id: S001_confirm_base, band_record_id: E003_band_kq01_fold2}
  lightgbm_presets:
    - {name: L0, rounds: 200, overrides: {}}
    - {name: L1, rounds: 200, overrides: {num_leaves: 15, min_data_in_leaf: 500, lambda_l2: 5.0}}
    - {name: L2, rounds: 200, overrides: {num_leaves: 63, lambda_l2: 5.0}}
    - {name: L3, rounds: 200, overrides: {min_data_in_leaf: 500, lambda_l2: 10.0, feature_fraction: 0.8}}
    - {name: L4, rounds: 400, overrides: {learning_rate: 0.025}}
    - {name: L5, rounds: 400, overrides: {feature_fraction: 0.8}}
  ridge:
    solver: lsqr
    tol: 1.0e-6
    max_iter: 200
    fit_intercept: true
    batch_rows: 100000
    num_threads: 8
  ridge_presets:
    - {name: R1, alpha: 100.0}
    - {name: R2, alpha: 10000.0}
    - {name: R3, alpha: 1000000.0}
  blend_weights: [0.0, 0.25, 0.5, 0.75, 1.0]

# 成员 B 复核 S002 的优化候选（见 docs/model_research_S002_review.md）。
# 与 model_research 的锁定协议**并存而不冲突**：本段默认不参与 S002 的筛选/确认
# 状态机（validate_protocol 只检查 model_research 段），需成员 A 确认后才用于正式
# 训练与提交。R1 = 沿用 S002 筛出的 L1/R2 组件，融合权重改 0.35，叠加排名平滑
# alpha=0.9 与冷启动留仓带 keep_q=0.1；两折 band 综合分 0.365447 / 0.362941。
optimized_candidate:
  name: R1
  study_id: S002
  components: [L1, R2]
  blend_weights: [0.35, 0.65]
  method: same_day_percentile_rank
  smooth_alpha: 0.9
  keep_q: 0.1
  initial_state: cold_start
  enabled: false

# S003: jointly tune LightGBM and a common cold-start band on 2021–2023.
optuna:
  trial_budget: 50
  seed: 42
  startup_trials: 10
  multivariate: true
  pruning: false
  objective: mean_official_final_score
  initial_state: cold_start
  row_order: [trade_date, ts_code]
  baseline_keep_q: 0.1
  warm_keep_qs: [0.05, 0.075, 0.09, 0.11, 0.125, 0.15, 0.0, 1.0]
  folds:
    - {name: wf2021, train: [20180102, 20201231], valid: [20210101, 20211231]}
    - {name: wf2022, train: [20180102, 20211231], valid: [20220101, 20221231]}
    - {name: wf2023, train: [20180102, 20221231], valid: [20230101, 20231231]}
  confirm: {name: confirm2024, train: [20180102, 20231231], valid: [20240101, 20241231]}
  search_space:
    learning_rate: {low: 0.01, high: 0.08, log: true}
    num_leaves: {low: 15, high: 128}
    max_depth: [-1, 4, 5, 6, 7, 8, 9, 10, 11, 12]
    min_data_in_leaf: {low: 200, high: 10000, log: true}
    feature_fraction: {low: 0.5, high: 1.0}
    bagging_fraction: {low: 0.5, high: 1.0}
    lambda_l1: {low: 0.0, high: 20.0}
    lambda_l2: {low: 0.0001, high: 50.0, log: true}
    num_boost_round: [200, 400, 800]
    band_keep_q: {low: 0.0, high: 1.0}
